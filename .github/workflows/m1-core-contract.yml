name: Site Kit M1 core contracts

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - '.github/workflows/m1-core-contract.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '.github/workflows/m1-core-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure ESM syntax
        run: node --check packages/core/index.mjs
      - name: Run core contract and lifecycle tests
        run: node --test packages/core/tests/*.test.mjs
      - name: Install pinned TypeScript for declaration verification
        run: npm install --prefix packages/core --no-audit --no-fund --no-package-lock
      - name: Typecheck exported NodeNext contract and invalid overrides
        run: npm run --prefix packages/core test:types
