name: Site Kit optional-module runtime and bundle audit

on:
  pull_request:
    paths:
      - 'packages/runtime/**'
      - 'packages/features/**'
      - 'spikes/m0/static-tests/**'
      - 'spikes/m0/playwright.static.config.mjs'
      - '.github/workflows/optional-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/runtime/**'
      - 'packages/features/**'
      - 'spikes/m0/static-tests/**'
      - 'spikes/m0/playwright.static.config.mjs'
      - '.github/workflows/optional-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native isolated import and history tests
        run: node --test packages/runtime/tests/*.test.mjs packages/features/tests/history.test.mjs
      - name: Install build/test tools only (esbuild and TypeScript)
        run: npm install --prefix packages/runtime --no-audit --no-fund --no-package-lock
      - name: Typecheck catalog contract
        run: npm run --prefix packages/runtime test:types
      - name: Install opt-in peer in owning feature package for bundle-only PoC
        run: npm install --prefix packages/features --no-package-lock --no-audit --no-fund
      - name: Quantify genuinely lazy ESM code chunks
        run: npm run --prefix packages/runtime audit:bundle
      - name: Keep bounded code-size evidence
        uses: actions/upload-artifact@v4
        with:
          name: site-kit-optional-bundle-size
          path: packages/runtime/artifacts/bundle-report.json
          retention-days: 14
      - name: Prove standalone pinned static ESM distribution
        run: node packages/runtime/scripts/build-static-kit.mjs
      - name: Install independent static-host browser test runner
        run: npm install --prefix spikes/m0 --no-package-lock --no-audit --no-fund
      - name: Record installed license metadata without claiming license acceptance
        run: node packages/runtime/scripts/audit-dependency-metadata.mjs
      - name: Archive transitive dependency/notice filename findings
        uses: actions/upload-artifact@v4
        with:
          name: site-kit-dependency-license-evidence
          path: packages/runtime/artifacts/dependency-license-report.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare Chromium and WebKit for real static HTML
        run: cd spikes/m0 && npx playwright install chromium webkit --with-deps
      - name: Browser-test emitted static artifact with no Vite/React/runtime CDN
        run: cd spikes/m0 && npx playwright test --config playwright.static.config.mjs
      - name: Keep independent-browser request and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-kit-independent-static-browser
          path: spikes/m0/test-results/**
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve unreleased static manifest and fingerprinted ESM
        uses: actions/upload-artifact@v4
        with:
          name: site-kit-static-esm-proof
          path: packages/runtime/artifacts/static-kit/**
          retention-days: 14
          if-no-files-found: error

