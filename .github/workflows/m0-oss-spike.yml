name: M0 OSS composition spike (read-only public CI)
on:
  pull_request:
    paths:
      - 'spikes/m0/**'
      - '.github/workflows/m0-oss-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/m0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct OSS dependencies
        run: npm install --no-audit --no-fund
      - name: Verify direct package identity and license
        run: |
          npm ls --depth=0
          node -e "for(const x of ['@awesome.me/webawesome','@tanstack/hotkeys','@tanstack/react-hotkeys']) {const p=require('./node_modules/'+x+'/package.json');console.log(p.name,p.version,p.license);}"
      - name: Inventory transitive versions/licenses (not legal approval)
        run: node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: m0-transitive-inventory
          path: spikes/m0/artifacts/m0-dependency-inventory.json
          retention-days: 14
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install chromium webkit --with-deps
      - name: Execute pinned browser smoke tests
        run: npm run test:e2e
      - name: Build both host fixtures
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/react.html
          test -s dist/404.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
